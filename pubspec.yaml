name: mudra_manager

description: "Mudra Manager — local-first personal finance app for India. Track expenses, budgets, goals, and more. 100% offline."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.5.29+69
minSdk: 29
targetSdk: 35
ndkVersion: 27.0.12077973

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: 3.41.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.0.15 # To find the correct directory for the database
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  uuid: ^4.0.0
  google_fonts: ^8.0.2
  flutter_animate: ^4.2.0
  animations: ^2.0.11
  dynamic_color: ^1.7.0
  responsive_framework: ^1.5.1
  auto_size_text: ^3.0.0
  fl_chart: ^1.2.0
  month_picker_dialog: ^6.0.3
  percent_indicator: ^4.2.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1
  crypto: ^3.0.6
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_native_timezone_latest: ^1.0.0
  encrypt: ^5.0.3
  file_picker: ^11.0.2
  json_annotation: ^4.9.0
  envied: ^1.1.1
  excel: ^4.0.6
  pdf: ^3.10.1
  printing: ^5.12.0
  open_file: ^3.5.10
  math_expressions: ^3.1.0
  go_router: ^17.2.1
  home_widget: ^0.9.1
  url_launcher: ^6.3.1
  table_calendar: ^3.1.2
  in_app_update: ^4.2.5
  in_app_review: ^2.0.10
  workmanager: ^0.9.0+3
  logger: ^2.6.2
  lucide_icons_flutter: ^3.1.9
  confetti: ^0.8.0
  flutter_svg: ^2.0.10+1
  flutter_boring_avatars: ^2.1.0
  mudra_plugin_sdk:
    path: ./mudra_plugin_sdk
  # Cloud providers for backup sync
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.2.2
  visibility_detector: ^0.4.0+2
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+8
  async: ^2.13.0
  share_plus: ^12.0.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.0
  build_runner: ^2.4.6 # Tool to run code generators
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.7.1
  envied_generator: ^1.1.1
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png" # your app icon path

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: MudraManagerAvatar
      fonts:
        - asset: assets/fonts/MudraManagerAvatar.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont_wdth,wght.ttf

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/
    - assets/icons/100/
    - assets/icons/20/
    - assets/icons/medals/
    - assets/logo/banks/
    - assets/logo/file/
    - assets/logo/nav/outline/
    - assets/logo/nav/solid/
    - assets/logo/personality/
    - assets/logo/logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/help_content.json
    - assets/plugins/manifest.json

