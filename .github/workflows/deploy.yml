name: Deploy to Play Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Verify Java
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          which java

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$/\1+\2/p' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          build_name="${version%%+*}"
          build_number="${version##*+}"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $build_name (versionCode $build_number)"

      - name: Build App Bundle
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          flutter build appbundle \
            --release \
            --flavor prod \
            --build-name "${{ steps.version.outputs.build_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --verbose
        continue-on-error: false

      - name: Verify Android version code
        run: |
          manifest_metadata="build/app/intermediates/merged_manifests/prodRelease/processProdReleaseManifest/output-metadata.json"
          test -f "$manifest_metadata"
          grep -q '"versionCode": ${{ steps.version.outputs.build_number }}' "$manifest_metadata"
          echo "Verified versionCode ${{ steps.version.outputs.build_number }}"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.mudramanager.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
