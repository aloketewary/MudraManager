name: mudra_manager
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.0+7
minSdk: 29
targetSdk: 33
ndkVersion: 27.0.12077973

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.0.15 # To find the correct directory for the database
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  intl: ^0.20.2
  uuid: ^4.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.2.0
  animations: ^2.0.11
  dynamic_color: ^1.7.0
  responsive_framework: ^1.5.1
  auto_size_text: ^3.0.0
  fl_chart: ^0.71.0
  month_picker_dialog: ^6.0.3
  percent_indicator: ^4.2.2
  local_auth: ^2.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1
  another_telephony: ^0.5.0-pre.1
  crypto: ^3.0.6
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  flutter_native_timezone_latest: ^1.0.0
  encrypt: ^5.0.3
  file_picker: ^10.1.2
  json_annotation: ^4.9.0
  envied: ^1.1.1
  excel: ^2.1.0
  pdf: ^3.10.1
  printing: ^5.12.0
  open_file: ^3.5.10
  math_expressions: ^2.7.0
  go_router: ^14.6.2
  home_widget: ^0.7.0
  url_launcher: ^6.3.1
  table_calendar: ^3.1.2
  in_app_update: ^4.2.5
  workmanager: ^0.9.0+3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_community_generator: ^3.3.0
  build_runner: ^2.4.6 # Tool to run code generators
  flutter_launcher_icons: ^0.13.1
  json_serializable: ^6.7.1
  envied_generator: ^1.1.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/rupee.png" # your app icon path

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: MudraManagerAvatar
      fonts:
        - asset: assets/fonts/MudraManagerAvatar.ttf

    - family: Parkinsans
      fonts:
        - asset: assets/fonts/Parkinsans-Bold.ttf
        - asset: assets/fonts/Parkinsans-ExtraBold.ttf
        - asset: assets/fonts/Parkinsans-Light.ttf
        - asset: assets/fonts/Parkinsans-Medium.ttf
        - asset: assets/fonts/Parkinsans-Regular.ttf
        - asset: assets/fonts/Parkinsans-SemiBold.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest/static/Onest-Black.ttf
          weight: 900 # Black
        - asset: assets/fonts/Onest/static/Onest-Bold.ttf
          weight: 700 # Bold
        - asset: assets/fonts/Onest/static/Onest-ExtraBold.ttf
          weight: 800 # ExtraBold
        - asset: assets/fonts/Onest/static/Onest-ExtraLight.ttf
          weight: 200 # ExtraLight
        - asset: assets/fonts/Onest/static/Onest-Light.ttf
          weight: 300 # Light
        - asset: assets/fonts/Onest/static/Onest-Medium.ttf
          weight: 500 # Medium
        - asset: assets/fonts/Onest/static/Onest-Regular.ttf
          weight: 400 # Regular
        - asset: assets/fonts/Onest/static/Onest-SemiBold.ttf
          weight: 600 # SemiBold
        - asset: assets/fonts/Onest/static/Onest-Thin.ttf
          weight: 100 # Thin

    - family: Tuffy
      fonts:
        - asset: assets/fonts/Tuffy/Tuffy-Bold.ttf
        - asset: assets/fonts/Tuffy/Tuffy-BoldItalic.ttf
        - asset: assets/fonts/Tuffy/Tuffy-Italic.ttf
        - asset: assets/fonts/Tuffy/Tuffy-Regular.ttf





  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/48/
    - assets/icons/96/
    - assets/icons/128/
    - assets/icons/512/
    - assets/logo/rupee.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/help_content.json